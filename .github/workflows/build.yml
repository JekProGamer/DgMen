name: Build DgMenHealthReward

on:
  push:
    paths:
      - "DgMenHealthReward/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "DgMenHealthReward/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore DgMenHealthReward/DgMenHealthReward.csproj
      - name: Build
        run: dotnet build DgMenHealthReward/DgMenHealthReward.csproj -c Release --no-restore
      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: DgMenHealthReward
          path: DgMenHealthReward/bin/Release/net10.0/DgMenHealthReward.dll
